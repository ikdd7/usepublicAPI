<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>경조사 봉투 인쇄 템플릿 (프리미엄)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    @page { size: A4; margin: 12mm; }
    body { font-family: "Nanum Myeongjo", serif; color: #1a1a1a; }
    .no-print { font-family: sans-serif; background: #f6efe4; padding: 14px; border-radius: 10px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
    .env {
      width: 100%; height: 58mm; border: 1.5px solid #333; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; position: relative;
      page-break-inside: avoid;
    }
    .front { font-size: 26pt; font-weight: 800; letter-spacing: 10px; }
    .tag { position: absolute; top: 4mm; left: 4mm; font-size: 8pt; color: #999; font-family: sans-serif; }
    .name { position: absolute; bottom: 4mm; left: 5mm; font-size: 9pt; color: #bbb; }
    h2 { font-family: sans-serif; font-size: 13pt; margin: 10mm 0 4mm; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <div class="no-print">
    🖨️ <strong>인쇄 방법</strong>: Ctrl/⌘ + P → 용지 A4, 여백 기본 → 인쇄 또는 'PDF로 저장'.
    봉투 모양에 맞춰 잘라 사용하거나, 실제 봉투 위에 대고 따라 쓰세요.
  </div>

  <h2>결혼 · 경사</h2>
  <div class="grid">
    <div class="env"><span class="tag">결혼</span><span class="front">祝 結婚</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">결혼</span><span class="front">祝 華婚</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">개업</span><span class="front">祝 發展</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">승진</span><span class="front">祝 昇進</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">환갑/칠순</span><span class="front">祝 壽宴</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">돌</span><span class="front">祝 生日</span><span class="name">이름·소속</span></div>
  </div>

  <h2>조의 · 부의</h2>
  <div class="grid">
    <div class="env"><span class="tag">부의</span><span class="front">賻 儀</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">근조</span><span class="front">謹 弔</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">조의</span><span class="front">弔 意</span><span class="name">이름·소속</span></div>
    <div class="env"><span class="tag">추모</span><span class="front">追 慕</span><span class="name">이름·소속</span></div>
  </div>
</body>
</html>
