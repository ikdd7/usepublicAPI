<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ECEAE5" />
<title>우리동네 복지·지원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --acc:#454896;            /* 포인트(인디고) */
    --acc-glow:#45489666;
    --ink:#1B1A17; --muted:#8A8578; --faint:#A8A296;
    --page:#ECEAE5; --card:#FFFFFF; --result-bg:#F6F5FB;
    --f1:#F4F2ED; --f2:#F0EEE8; --f3:#F2F0EA; --f4:#E7E5DE; --track:#EEEBE4;
    --hot:#FF7A1A; --kakao:#FEE500; --kakao-ink:#3A1D1D;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{font-family:'Pretendard',-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--page);color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 60px;min-height:100vh}
  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .phone{width:100%;max-width:420px;border-radius:34px;overflow:hidden;box-shadow:0 26px 80px rgba(0,0,0,.18);position:relative;background:var(--card)}
  .screen{min-height:842px;animation:fadeIn .25s ease}
  .hidden{display:none!important}

  /* ── 입력 화면 ── */
  #screenInput{background:var(--card)}
  .pad{padding:30px 24px 124px}
  .locbadge{display:inline-flex;align-items:center;gap:7px;background:var(--f1);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:#6F6A60;margin-bottom:22px;white-space:nowrap}
  h1{font-size:31px;line-height:1.18;font-weight:800;letter-spacing:-.03em;margin:0 0 30px}
  .field{border-bottom:2px solid var(--f2);padding-bottom:18px;margin-bottom:18px}
  .field.tap{cursor:pointer}
  .field-top{display:flex;align-items:center;justify-content:space-between;white-space:nowrap}
  .field-label{font-size:13px;font-weight:700;color:var(--faint)}
  .field-action{font-size:13px;font-weight:700;color:var(--acc)}
  .field-val{font-size:21px;font-weight:800;margin-top:5px}
  .agefield{padding-bottom:20px;margin-bottom:22px}
  .agefield .field-top{margin-bottom:14px}
  .agefield .field-val{margin-top:0}
  #regionPicker{margin-top:14px;display:flex;gap:8px}
  #regionPicker.hidden{display:none}
  #regionPicker select{flex:1;min-width:0;background:var(--f1);border:1.5px solid var(--f2);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;border-radius:13px;padding:12px 10px;outline:none}
  #regionPicker select:focus{border-color:var(--acc)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--track);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:pointer}
  .sit-top{margin-bottom:10px;white-space:nowrap}
  .sit-top .field-label{display:inline}
  .sit-count{font-size:13px;font-weight:700;color:var(--acc);margin-left:4px}
  .sit-help{font-size:12.5px;color:var(--faint);font-weight:500;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:999px;border:1.5px solid transparent;background:var(--f1);color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;transition:all .12s ease}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cta-wrap{position:absolute;left:0;right:0;bottom:0;padding:16px 24px 26px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}
  .cta{width:100%;border:none;background:var(--acc);color:#fff;font-family:inherit;font-size:17px;font-weight:800;padding:18px;border-radius:18px;box-shadow:0 12px 26px rgba(69,72,150,.32);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .cta:active{transform:translateY(1px)}

  /* ── 결과 화면 ── */
  #screenResult{background:var(--result-bg)}
  .summary-bar{display:flex;align-items:center;gap:6px;padding:18px 20px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .summary-bar .line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .summary-bar .edit{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--acc);cursor:pointer;flex-shrink:0;padding:4px;white-space:nowrap}
  .hero{margin:0 16px;background:var(--ink);border-radius:26px;padding:26px 24px;color:#fff;position:relative;overflow:hidden;animation:popIn .4s ease}
  .hero .glow{position:absolute;right:-26px;bottom:-34px;width:130px;height:130px;border-radius:50%;background:var(--acc-glow);filter:blur(2px)}
  .hero .cap{font-size:13px;font-weight:600;opacity:.65;margin-bottom:12px;position:relative}
  .hero .total{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:18px;position:relative;white-space:nowrap}
  .hero .total .unit{font-size:27px;margin-left:2px;font-weight:800}
  .hero .pills{display:flex;gap:7px;position:relative;flex-wrap:wrap}
  .hero .pill{font-size:12px;font-weight:700;background:rgba(255,255,255,.13);padding:7px 12px;border-radius:999px;white-space:nowrap}
  .share-wrap{padding:14px 16px 6px}
  .share{width:100%;border:none;background:var(--kakao);color:var(--kakao-ink);font-family:inherit;font-size:15px;font-weight:800;padding:15px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .share .k{width:20px;height:20px;border-radius:5px;background:var(--kakao-ink);display:flex;align-items:center;justify-content:center;color:var(--kakao);font-size:12px;font-weight:900}
  .groups{padding:12px 22px 32px}
  .group{margin-bottom:22px}
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .group-head .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .group-head .cat{font-size:13.5px;font-weight:800;white-space:nowrap}
  .group-head .meta{font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
  .group-head .rule{flex:1;height:1px;background:var(--f4)}
  .group-card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid rgba(27,26,23,.05);box-shadow:0 6px 18px rgba(28,26,20,.04)}
  .prow{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--f3);text-decoration:none;color:inherit}
  .prow:first-child{border-top:none}
  .prow:active{background:var(--f3)}
  .prow .body{flex:1;min-width:0}
  .prow .name{font-size:14.5px;font-weight:700;margin-bottom:3px;line-height:1.35}
  .prow .sub{font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
  .badge{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:7px;white-space:nowrap;flex-shrink:0}
  .badge.normal{color:var(--faint);background:var(--f1)}
  .badge.hot{color:#fff;background:var(--hot)}
  .empty{text-align:center;color:var(--faint);font-size:14px;font-weight:600;line-height:1.7;padding:50px 20px;background:#fff;border-radius:18px;border:1px solid rgba(27,26,23,.05)}
  .disclaimer{font-size:12px;line-height:1.7;color:var(--faint);font-weight:500;border-top:1px solid var(--f4);padding-top:18px;margin-top:6px}

  /* ── 토스트 ── */
  .toast{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .25s ease;white-space:nowrap;z-index:5}
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 입력 화면 ============ -->
  <div class="screen" id="screenInput">
    <div class="pad">
      <span class="locbadge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        우리동네 복지·지원
      </span>
      <h1>세 가지만<br>알려주세요</h1>

      <!-- 지역 -->
      <div class="field">
        <div class="field-top tap" id="regionToggle">
          <span class="field-label">지역</span>
          <span class="field-action">변경 ▾</span>
        </div>
        <div class="field-val" id="regRowVal">—</div>
        <div id="regionPicker" class="hidden">
          <select id="sido" title="시·도"></select>
          <select id="region" title="시·군·구"></select>
        </div>
      </div>

      <!-- 나이 -->
      <div class="field agefield">
        <div class="field-top">
          <span class="field-label">나이</span>
          <span class="field-val" id="ageLabel">만 27세</span>
        </div>
        <input id="age" type="range" min="0" max="100" value="27" />
      </div>

      <!-- 성별 -->
      <div class="field">
        <div class="field-top"><span class="field-label">성별</span><span class="field-action" id="genderHint">무관</span></div>
        <div class="chips" id="genderChips" style="margin-top:12px">
          <span class="chip" data-gender="female">여성</span>
          <span class="chip" data-gender="male">남성</span>
        </div>
      </div>

      <!-- 내 상황 -->
      <div class="sit-top">
        <span class="field-label">내 상황</span><span class="sit-count" id="sitCount">0개 선택</span>
      </div>
      <div class="sit-help">해당하는 것만 골라주세요. 누를수록 더 정확해져요.</div>
      <div class="chips" id="chips">
        <span class="chip" data-tag="구직중">구직중</span>
        <span class="chip" data-tag="재직중">재직중</span>
        <span class="chip" data-tag="학생">학생</span>
        <span class="chip" data-tag="자영업·창업">소상공인·창업</span>
        <span class="chip" data-tag="1인가구">1인가구</span>
        <span class="chip" data-tag="신혼">신혼</span>
        <span class="chip" data-tag="임신·출산">임신·출산</span>
        <span class="chip" data-tag="육아">육아</span>
        <span class="chip" data-tag="다자녀">다자녀</span>
        <span class="chip" data-tag="한부모">한부모</span>
        <span class="chip" data-tag="어르신">어르신</span>
        <span class="chip" data-tag="장애인">장애인</span>
        <span class="chip" data-tag="저소득">저소득</span>
        <span class="chip" data-tag="무주택">무주택·자취</span>
      </div>
    </div>

    <div class="cta-wrap">
      <button class="cta" id="openResult">지갑 열어보기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <!-- ============ 결과 화면 ============ -->
  <div class="screen hidden" id="screenResult">
    <div class="summary-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="line" id="summaryLine"></span>
      <button class="edit" id="backToInput">수정</button>
    </div>

    <div class="hero">
      <div class="glow"></div>
      <div class="cap">받을 수 있는 지원 합계 · 최대 추정</div>
      <div class="total"><span id="totalNum">0</span><span class="unit">만원</span></div>
      <div class="pills">
        <span class="pill">받을 수 있는 지원 <b id="matchedCount">0</b>건</span>
        <span class="pill">대출 별도 <b id="loanCount">0</b>건</span>
      </div>
    </div>

    <div class="share-wrap">
      <button class="share" id="shareBtn"><span class="k">k</span>친구에게 카톡으로 알려주기</button>
    </div>

    <div class="groups" id="groups"></div>
  </div>

</div>

<script>
const DATA = {
  benefits: [
    {id:"rent",title:"인천형 청년월세 지원사업",category:"주거",amount:2400000,amount_label:"월 최대 20만원 (연 최대 240만원)",age_min:19,age_max:39,need:["무주택"],support_type:"현금",apply_end:"2026-12-29",how:"복지로/인천청년포털",contact:"연수구 일자리정책과",source:"https://youth.incheon.go.kr/dwelling/monthly.jsp"},
    {id:"dream",title:"드림체크카드 (구직활동비)",category:"일자리",amount:3000000,amount_label:"월 50만원 × 6개월 = 최대 300만원",age_min:18,age_max:39,need:["구직중"],support_type:"현금",apply_end:"2026-12-31",how:"인천청년포털 온라인 신청",contact:"인천청년포털",source:"https://youth.incheon.go.kr/job/dream.jsp"},
    {id:"interview",title:"청년 면접수당",category:"일자리",amount:100000,amount_label:"면접 1회 5만원 × 최대 2회 = 10만원",age_min:18,age_max:39,need:["구직중"],support_type:"현금",apply_end:"2026-07-15",how:"관할 구청 일자리정책과",contact:"연수구 일자리정책과",source:"https://youth.incheon.go.kr/youthpolicy/youthPolicyInfoDetail.do?poly_seq=277"},
    {id:"account",title:"드림For 청년통장 (자산형성)",category:"금융",amount:5400000,amount_label:"3년간 시 지원 540만원",age_min:18,age_max:39,need:["재직중"],support_type:"현금",apply_end:"2026-06-30",how:"인천청년포털 온라인 신청",contact:"인천테크노파크",source:"https://youth.incheon.go.kr/financial/dreamfor.jsp"},
    {id:"welfare",title:"인천 재직청년 복지포인트",category:"복지",amount:500000,amount_label:"연 복지포인트 (재직 청년)",age_min:18,age_max:39,need:["재직중"],support_type:"바우처",apply_end:"2026-12-31",how:"인천테크노파크 신청",contact:"인천테크노파크",source:"https://www.itp.or.kr/intro.asp?tmid=428"},
    {id:"mind",title:"청년 마음건강 지원 (심리상담)",category:"건강",amount:0,amount_label:"전문 심리상담 회기 지원 (현물)",age_min:19,age_max:39,need:["구직중"],support_type:"서비스",apply_end:"2026-12-31",how:"복지로/연수구 보건소",contact:"연수구 청년정책 담당",source:"https://www.bokjiro.go.kr/"}
  ]
};

const TODAY = new Date();
let screen = "input";
let selected = new Set(["구직중","1인가구","무주택"]);   // 기본 선택(레퍼런스)
let gender = "all";   // "all" | "female" | "male"
let selSido = "인천광역시";
let selRegion = "인천광역시 연수구";
let toastTimer = null;

/* ── 카테고리 색상·순서 ── */
const CAT_COLORS = {
  "주거":"#16B877","일자리":"#2B6FFF","창업·소상공인":"#F76707","금융":"#7C5CFF","교육":"#FF7A1A","문화":"#E8590C",
  "환경·생활":"#11B5A6","건강":"#0CA678","복지":"#8A8578","육아":"#F0568B","농업":"#74B816",
  "구청공고":"#868E96","기타":"#A8A296"
};
const CAT_ORDER = ["주거","일자리","창업·소상공인","금융","교육","문화","환경·생활","건강","육아","복지","농업","구청공고","기타"];
const catColor = (c)=> CAT_COLORS[c] || "#A8A296";
// 창업·소상공인은 일자리에서 분리해 별도 그룹으로
function dispCat(b){
  const tags = b._tags || itemTags(b);
  const t = `${b.title||""} ${b.summary||""} ${b.amount_label||""}`;
  if(tags.has("자영업·창업") || /창업|소상공인|소공인|전통시장|점포|자영업/.test(t)) return "창업·소상공인";
  return b.category || "기타";
}

/* ── 상황 자동 태깅 ── */
const CHIP_TAGS = new Set(["구직중","재직중","학생","자영업·창업","1인가구","신혼","임신·출산","육아","다자녀","한부모","다문화","어르신","장애인","저소득","무주택"]);
const TAG_RULES = [
  ["구직중", /미취업|구직|실업|취업\s*준비|구직활동|취업\s*지원|일자리/],
  ["재직중", /재직|근로자|직장인|재직자|근속/],
  ["학생", /대학생|대학원생|재학생|휴학생|학생|학자금|장학/],
  ["자영업·창업", /소상공인|자영업|자영자|창업|점포|상인|전통시장|1인\s*사업|소공인/],
  ["1인가구", /1인\s*가구|독거|혼자\s*사는/],
  ["신혼", /신혼|예비\s*부부/],
  ["임신·출산", /임신|임산부|출산|난임|산모|영아|출생아?/],
  ["육아", /육아|영유아|보육|양육|어린이집|아이돌봄|아동수당|보육료/],
  ["다자녀", /다자녀|셋째|넷째|두\s*자녀|세\s*자녀|다둥이/],
  ["한부모", /한부모|조손|미혼모|미혼부/],
  ["다문화", /다문화|결혼이민|외국인주민|이주여성|중도입국|북한이탈/],
  ["어르신", /노인|어르신|고령|경로당?|기초연금|시니어|치매|장기요양/],
  ["장애인", /장애/],
  ["저소득", /기초생활|차상위|저소득|중위소득|기초수급|생계급여|긴급복지|기초연금/],
  ["무주택", /무주택|월세|전세|임차|주거급여|전월세|보증금|임대주택/],
  ["__기업", /중소기업|중견기업|대기업|법인|기업육성|사업체|스타트업|벤처기업|제조업|수출기업|신용보증|보증재단|투자유치|R&D|연구개발|기업\s*부설|판로|경영안정자금/],
];
function itemTags(b){
  const blob = `${b.title} ${b.category||""} ${b.amount_label||""} ${b.summary||""} ${(b.need||[]).join(" ")}`;
  const t = new Set();
  for(const n of (b.need||[])) if(CHIP_TAGS.has(n)) t.add(n);
  for(const [tag,re] of TAG_RULES) if(re.test(blob)) t.add(tag);
  return t;
}
const NOISE_RE = /결과\s*(발표|공개|안내|보고)|선정\s*결과|선정자|합격자|최종\s*선정|낙찰|입찰\s*공고|계약\s*(체결|현황)|간담회|설명회|공청회|토론회|워크숍|위원\s*(공개)?모집|위원회\s*(구성|위촉|개최)|회의\s*(결과|개최|록)|조례|규정\s*(개정|제정|안)|보도자료|포토\s*뉴스|카드\s*뉴스|채용\s*공고|임용|인사발령|정산\s*(현황|결과)|운영\s*결과|추진\s*실적|실태조사|의견\s*수렴|고시\s*제?\s*\d|공람|열람|입법예고/;
const isNoise = (b)=> NOISE_RE.test(`${b.title}`);
function isSpecial(b){
  const blob = `${b.title} ${b.amount_label||""} ${b.summary||""} ${(b.need||[]).join(" ")}`;
  if(/자동\s*지급|별도\s*신청\s*(없이|불필요)|일괄\s*지급|소급\s*적용|직권/.test(blob)) return true;
  return false;
}
const PROGRAM_RE = /모집|수강생|서포터즈|위원\s*(위촉|모집)|세미나|설명회|공모|특강|교실|아카데미|체험단|봉사자|기자단|홍보단|동아리/;

/* ── 금액·마감 ── */
function won(n){ return n>=10000 ? (n/10000).toLocaleString()+"만원" : n.toLocaleString()+"원"; }
function dday(end){ return Math.ceil((new Date(end)-TODAY)/86400000); }
function deriveExpiry(b){
  let end = b.apply_end || null;
  if(!end){
    const blob = `${b.title} ${b.amount_label||""} ${b.summary||""}`;
    const ds = blob.match(/20\d{2}\s*[.\-/년]\s*\d{1,2}\s*[.\-/월]\s*\d{1,2}/g);
    if(ds&&ds.length){ const last=ds[ds.length-1].replace(/[^0-9]/g,""); if(last.length>=8) end=`${last.slice(0,4)}-${last.slice(4,6)}-${last.slice(6,8)}`; }
  }
  if(!end) return {expired:false, end:null};
  return {expired:(new Date(end)-TODAY)/86400000 < 0, end};
}
function keyAmount(b){
  if(b.amount_clean) return b.amount_clean;
  const src = `${b.amount_label||""} ${b.title||""}`;
  const money = src.match(/(최대\s*)?(월|연간?|분기|1인당|가구당|연)?\s*\d[\d,]*\s*(억\s*원?|만\s*원|원)/);
  if(money) return money[0].replace(/\s+/g,"");
  const pct = src.match(/([가-힣]{2,12})\s*의\s*(최대\s*)?\d[\d,]*\s*(%|포인트)/) || src.match(/([가-힣]{2,8}(?:비|료|금|액|용|값))\s*(최대\s*)?\d[\d,]*\s*(%|포인트)/);
  if(pct) return pct[0].replace(/\s+/g," ").trim();
  if(b.amount>0) return "최대 "+won(b.amount);
  const al = (b.amount_label||"").trim();
  if(al && al.length<=16 && /[\d원%]/.test(al)) return al;   // 짧고 금액성일 때만 노출(긴 설명 누수 방지)
  return /현물|서비스/.test(b.support_type||"") ? "현물·서비스 지원" : "지원 내용 확인";
}
function clip(s,n){ return s ? `${s}`.replace(/\s+/g," ").trim().slice(0,n) : ""; }
function tidyDesc(t){ return `${t||""}`.replace(/[\(（][^)）]*[\)）]/g," ").replace(/\s*[*※].*$/,"").replace(/\s+/g," ").trim(); }
// 카드 부제: 이름만으론 모를 공고를 위해 '설명'을 우선(요약/목적) + 금액
function rowSub(b){
  const ka = keyAmount(b);
  const money = (ka && !/확인|지원\s*내용/.test(ka)) ? ka : "";
  let desc = (b.summary && b.summary.replace(/\s/g,"").length>=6) ? b.summary : "";
  if(!desc){ const al=(b.amount_label||"").trim(); if(al.length>=10 && !/^(상세|참조)/.test(al)) desc=al; }
  let s = desc ? clip(tidyDesc(desc),44) : (b.support_type||"지원");
  if(money) s += " · "+money;
  if(isLoan(b)) s += " · 합계 제외";
  return s;
}
function isLoan(b){ return /대출/.test(b.support_type||"") || (b._tags && b._tags.has && b._tags.has("__기업")); }
function realAmount(b){
  const st = b.support_type || "";
  if(!/현금|현물|바우처/.test(st)) return 0;
  if(isLoan(b)) return 0;
  const a = b.amount || 0;
  return (a>0 && a<100000000) ? a : 0;
}

/* ── 지역 매칭 ── */
const SIDO_CORE = [["서울","서울특별시"],["부산","부산광역시"],["대구","대구광역시"],["인천","인천광역시"],["광주","광주광역시"],["대전","대전광역시"],["울산","울산광역시"],["세종","세종특별자치시"],["경기","경기도"],["강원","강원특별자치도"],["충북","충청북도"],["충남","충청남도"],["전북","전북특별자치도"],["전남","전라남도"],["경북","경상북도"],["경남","경상남도"],["제주","제주특별자치도"]];
function regionMatch(b){
  if(!b.region) return true;
  if(b.region===selRegion) return true;
  if(b.region===selSido) return true;
  if(selRegion===selSido && b.region.startsWith(selSido+" ")) return true;
  if(b.region==="전국"){
    const blob = `${b.title} ${b.summary||""}`;
    const myCore = SIDO_CORE.find(c=>c[1]===selSido)?.[0];
    const named = SIDO_CORE.filter(c=>blob.includes(c[1])||blob.includes(c[0])).map(c=>c[0]);
    if(named.length && myCore && !named.includes(myCore)) return false;
    return true;
  }
  return false;
}

/* ── 스키마 통일 ── */
function toRuntime(b){
  const r = {
    id:b.id, title:b.title, category:b.category||"기타",
    amount: b.amount ?? b.amount_max_won ?? 0,
    amount_label: b.amount_label || "상세 참조",
    amount_clean: b.amount_clean || "",
    age_min: b.age_min ?? 0, age_max: b.age_max ?? 120,
    need: b.need || b.tags || [],
    region: b.region || "인천광역시 연수구",
    summary: b.summary || "",
    target: b.target || "",
    target_llm: b.target_llm || "",
    support_type: b.support_type || ((b.amount ?? b.amount_max_won ?? 0) > 0 ? "현금" : "서비스"),
    apply_end: b.apply_end || null,
    source: b.source || "#",
  };
  r._tags = itemTags(r);
  r.special = isSpecial(r) || isNoise(r) || b.special===true || b.show===false;
  const ex = deriveExpiry(r); r.expired = ex.expired; r.apply_end = r.apply_end || ex.end;
  return r;
}

/* ── 지역 셀렉트(전국 캐스케이드) ── */
let REGION_TREE = {};
function buildRegionSelect(){
  REGION_TREE = {};
  for(const b of DATA.benefits){
    const r = b.region; if(!r || r==="전국") continue;
    const sido = r.split(" ")[0];
    (REGION_TREE[sido] ||= new Set());
    if(r.includes(" ")) REGION_TREE[sido].add(r);
  }
  const sidos = Object.keys(REGION_TREE).sort();
  const sidoSel = document.getElementById("sido");
  if(!sidos.length){ sidoSel.innerHTML=""; document.getElementById("region").innerHTML=""; updateRegionVal(); return; }
  if(!sidos.includes(selSido)) selSido = sidos.includes("인천광역시") ? "인천광역시" : sidos[0];
  sidoSel.innerHTML = sidos.map(s=>`<option value="${s}"${s===selSido?" selected":""}>${s}</option>`).join("");
  buildSggSelect();
}
function buildSggSelect(){
  const sel = document.getElementById("region");
  const sggs = [...(REGION_TREE[selSido]||[])].sort();
  const opts = [{v:selSido, t:selSido.replace(/(특별자치도|특별자치시|특별시|광역시|도)$/,"")+" 전체"},
                ...sggs.map(r=>({v:r, t:r.split(" ").slice(1).join(" ")}))];
  if(!opts.some(o=>o.v===selRegion)){
    selRegion = opts.find(o=>o.v.endsWith("연수구"))?.v || opts[1]?.v || opts[0].v;
  }
  sel.innerHTML = opts.map(o=>`<option value="${o.v}"${o.v===selRegion?" selected":""}>${o.t}</option>`).join("");
  updateRegionVal();
}
function updateRegionVal(){ document.getElementById("regRowVal").textContent = selRegion; }

/* ── 매칭 ── */
function currentAge(){ return parseInt(document.getElementById("age").value)||0; }
// 데이터 나이 + 지원대상 원문에서 읽은 나이조건을 교집합으로 적용(미파싱 공고의 오매칭 방지)
function effectiveAgeRange(b){
  let lo = b.age_min ?? 0, hi = b.age_max ?? 120;
  const t = `${b.target_llm||""} ${b.target||""} ${b.title||""} ${b.summary||""} ${b.amount_label||""}`;
  let m = t.match(/만?\s*(\d{1,3})\s*세?\s*[~\-–]\s*만?\s*(\d{1,3})\s*세/);   // "19~39세", "만 19세~39세"
  if(m){ const a=+m[1], c=+m[2]; if(a<=c && c<=120){ lo=Math.max(lo,a); hi=Math.min(hi,c); } }
  m = t.match(/만?\s*(\d{2,3})\s*세\s*(이상|이후|부터)/);                      // "만50세이상"
  if(m){ const a=+m[1]; if(a>=19 && a<=110) lo=Math.max(lo,a); }
  m = t.match(/만?\s*(\d{2,3})\s*세\s*(이하|미만|까지)/);                      // "39세 이하" (자녀·아동 오인 방지로 19세+만)
  if(m){ const a=+m[1]; if(a>=19 && a<=110) hi=Math.min(hi,a); }
  // 숫자 없이도 강한 연령 신호(노년·고독사 등)는 하한 적용 — list API가 나이를 안 줄 때 보완
  if(/노인|어르신|고령|경로(당|우대)?|기초연금|장기요양/.test(t)) lo=Math.max(lo,65);
  if(/고독사|독거|홀몸|무연고|홀로\s*사는/.test(t)) lo=Math.max(lo,50);
  return [lo, hi];
}
function ageOk(b, age){ const [lo,hi]=effectiveAgeRange(b); return age>=lo && age<=hi; }
// 공고의 '전용 성별' 판별 — 생물학적 여성전용(임산부·산모·난임·경력단절여성 등)만 제한.
// 출산·육아·부모급여처럼 양쪽 다 받는 건 성별 제한 안 함.
function programGender(b){
  const t = `${b.title||""} ${b.target_llm||""} ${b.target||""} ${b.summary||""} ${b.amount_label||""} ${(b.need||[]).join(" ")}`;
  const female = /여성|여자|임산부|산모|임신부|난임|모성|경력\s*단절\s*여성|미혼모|여성\s*청소년|결혼이주여성|새일센터|자궁|난소|유방/;
  const male = /남성전용|남자전용|남성\s*대상|미혼부|전립선|남성\s*청소년/;
  if(female.test(t) && !/남성|남자/.test(t)) return "female";
  if(male.test(t) && !/여성|여자/.test(t)) return "male";
  return "all";
}
function genderOk(b, g){ if(g==="all") return true; const pg=programGender(b); return pg==="all" || pg===g; }
// 소수 특수대상(칩 없음) — 기본 제외
const RARE_RE = /북한이탈|탈북|새터민|국가유공|보훈|참전|상이군경|고엽제|보호\s*종료|자립\s*준비|아동복지시설|소년소녀가장|범죄피해|보호관찰|노숙인?|갱생|출소/;
function isRareTarget(b){
  return RARE_RE.test(`${b.title||""} ${b.target||""} ${b.target_llm||""} ${b.summary||""} ${(b.need||[]).join(" ")}`);
}
// 신분 게이트: 이 자격을 '겨냥한' 공고는 사용자가 그 상황을 골라야만 노출(장애인·창업 등)
const GATE_TAGS = ["장애인","다문화","한부모","다자녀","임신·출산","자영업·창업"];
function gatesOk(b){
  const tags = b._tags || itemTags(b);
  const blob = `${b.title||""} ${b.target||""} ${b.target_llm||""} ${b.summary||""} ${b.amount_label||""}`;
  for(const g of GATE_TAGS){
    if(!tags.has(g) || selected.has(g)) continue;
    // 장애인 '자녀·가족'을 돌보는(보호자) 대상이면 본인 장애가 아니므로 게이트 제외
    if(g==="장애인" && /장애[인아동]?\s*(자녀|아동|가족|부모|아이)|(자녀|아동|가족|자녀를)\D{0,6}장애/.test(blob)) continue;
    return false;
  }
  return true;
}
function matchedPrograms(){
  const age = currentAge();
  if(selected.size===0) return [];
  return DATA.benefits.filter(b=>{
    if(!regionMatch(b)) return false;
    if(b.expired || b.special) return false;
    if(!ageOk(b, age)) return false;
    if(!genderOk(b, gender)) return false;
    if(isRareTarget(b)) return false;        // 북한이탈·유공자 등 소수대상 제외
    if(!gatesOk(b)) return false;            // 장애인·창업 등 신분 게이트
    const tags = b._tags || itemTags(b);
    for(const t of selected) if(tags.has(t)) return true;
    return false;
  });
}
function sortScore(b){
  let s=0; const st=b.support_type||"";
  if(/현금|현물|바우처/.test(st)) s-=3; else if(/대출|서비스/.test(st)) s+=2;
  if(PROGRAM_RE.test(b.title)) s+=10;
  return s;
}

function renderResult(){

  const matched = matchedPrograms();

  const loanCount = matched.filter(isLoan).length;
  document.getElementById("totalNum").textContent = Math.floor(total/10000).toLocaleString();
  document.getElementById("matchedCount").textContent = matched.length;

  const cats = [...CAT_ORDER, ...[...new Set(matched.map(dispCat))].filter(c=>!CAT_ORDER.includes(c))];
  let html = "";
  for(const cat of cats){
    const items = matched.filter(b=>dispCat(b)===cat)
      .sort((a,b)=>{
        const sa=sortScore(a), sb=sortScore(b); if(sa!==sb) return sa-sb;
        const da=a.apply_end?dday(a.apply_end):9999, db=b.apply_end?dday(b.apply_end):9999;
        return (da<0?99999:da)-(db<0?99999:db);
      });
    if(!items.length) continue;
    const sum = items.filter(b=>!isLoan(b)).reduce((a,b)=>a+realAmount(b),0);
    const meta = items.length+"건"+(sum>0?" · "+won(sum):"");
    html += `<div class="group">
      <div class="group-head"><span class="dot" style="background:${catColor(cat)}"></span><span class="cat">${cat}</span><span class="meta">${meta}</span><span class="rule"></span></div>
      <div class="group-card">`+
      items.map(p=>{
        const d = p.apply_end ? dday(p.apply_end) : null;
        const hot = d!=null && d<=30;
        const badge = d==null ? "상시" : (d>=0 ? "D-"+d : "마감");
        const sub = rowSub(p);
        return `<a class="prow" href="${p.source}" target="_blank" rel="noopener">
          <div class="body"><div class="name">${esc(p.title)}</div><div class="sub">${esc(sub)}</div></div>
          <span class="badge ${hot?'hot':'normal'}">${badge}</span>
        </a>`;
      }).join("") + `</div></div>`;
  }
  if(!html){
    html = `<div class="empty">선택한 조건에 해당하는<br>지원을 찾지 못했어요.<br><br>‘수정’에서 상황을 더 골라보세요.</div>`;
  }
  html += `<div class="disclaimer" id="srcTag">검증 시드 · 데모용이며 금액·기간은 변동될 수 있어요. 신청 전 복지로·보조금24·관할 시·군·구청 등 공식 출처로 꼭 확인하세요.</div>`;
  document.getElementById("groups").innerHTML = html;
  if(window.__srcText){ const t=document.getElementById("srcTag"); if(t) t.textContent = window.__srcText; }
}
function esc(s){ return `${s||""}`.replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function render(){ renderInput(); if(screen==="result") renderResult(); }

function showScreen(s){

  document.getElementById("screenInput").classList.toggle("hidden", s!=="input");
  document.getElementById("screenResult").classList.toggle("hidden", s!=="result");
  if(s==="result") renderResult();
  window.scrollTo(0,0);
}

/* ── 이벤트 ── */
document.getElementById("chips").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  const t = c.dataset.tag;
  if(selected.has(t)) selected.delete(t); else selected.add(t);
  renderInput();
});
document.getElementById("age").addEventListener("input", ()=>{ document.getElementById("ageLabel").textContent="만 "+currentAge()+"세"; });
document.getElementById("genderChips").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  gender = (gender===c.dataset.gender) ? "all" : c.dataset.gender;
  renderGender();
});
function renderGender(){
  document.querySelectorAll("#genderChips .chip").forEach(c=>c.classList.toggle("on", c.dataset.gender===gender));
  document.getElementById("genderHint").textContent = gender==="female"?"여성":gender==="male"?"남성":"무관";
}
document.getElementById("regionToggle").addEventListener("click", ()=>{
  document.getElementById("regionPicker").classList.toggle("hidden");
});
document.getElementById("sido").addEventListener("change", e=>{ selSido=e.target.value; buildSggSelect(); });
document.getElementById("region").addEventListener("change", e=>{
  selRegion=e.target.value; updateRegionVal();
  document.getElementById("regionPicker").classList.add("hidden");
});
document.getElementById("openResult").addEventListener("click", ()=> showScreen("result"));
document.getElementById("backToInput").addEventListener("click", ()=> showScreen("input"));
document.getElementById("shareBtn").addEventListener("click", share);

function share(){
  const t = document.getElementById("totalNum").textContent;
  const msg = `[${selRegion} 복지·지원] 나 연 최대 ${t}만원 받을 수 있대! 너도 확인해봐 👉`;
  try{
    if(navigator.share){ navigator.share({title:"우리동네 복지·지원", text:msg}); return; }
    navigator.clipboard?.writeText(msg);
  }catch(e){}
  showToast();
}
function showToast(){
  let el = document.querySelector(".toast");
  if(!el){ el=document.createElement("div"); el.className="toast"; el.textContent="공유 링크를 복사했어요 ✓"; document.querySelector(".phone").appendChild(el); }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.remove(); }, 1800);
}

/* ── 데이터 로드 ── */
async function loadData(){
  for(const url of ["data/yeonsu_youth_live.json","data/yeonsu_youth.json"]){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(r.ok){ const j = await r.json();
        if(j.benefits?.length){
          DATA.benefits = j.benefits.map(toRuntime);
          window.__srcText = (j.meta?.source ? "데이터: "+j.meta.source : "")
            + (j.meta?.snapshot_date ? " · "+j.meta.snapshot_date : "")
            + " · 데모용이며 금액·기간은 변동될 수 있어요. 신청 전 공식 출처로 확인하세요.";
          return true;
        }
      }
    }catch(e){}
  }
  return false;
}

(async ()=>{
  const used = await loadData();
  if(!used) DATA.benefits = DATA.benefits.map(toRuntime);
  buildRegionSelect();
  renderInput();
})();
</script>
</body>
</html>
