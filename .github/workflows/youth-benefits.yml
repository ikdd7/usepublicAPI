name: 청년혜택 실데이터 수집 & 배포

# 자동 실행 안 함(수동 + 매일 스케줄만). Secret/Pages 설정 전엔 아무 일도 안 일어남.
on:
  workflow_dispatch: {}            # 액션 탭에서 'Run workflow' 버튼으로 수동 실행
  push:
    branches: ["claude/niche-market-structure-cQHsO"]   # 수집 로직 변경 시에만 전체 파이프라인
    paths:                          # index.html(프런트)은 deploy-frontend.yml가 빠르게 배포
      - "youth-benefits-demo/scraper/**"
      - ".github/workflows/youth-benefits.yml"
  schedule:                        # 매시간 수집(게시판은 캐시로 6시간마다만 실제 접속)
    - cron: "0 * * * *"           # 매시간 정각(UTC)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false       # 프런트 빠른 배포와 큐를 공유(서로 취소하지 않음)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 프록시 라이브러리(undici) 설치
        working-directory: youth-benefits-demo
        run: npm i undici@6 --no-save || true
      - name: 공공API 실데이터 수집 (복지로·보조금24·온통청년)
        working-directory: youth-benefits-demo
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}   # 게시판 fetch에만 적용(API 스캔은 직결)
        run: |
          if [ -z "$DATA_GO_KR_KEY" ] && [ -z "$YOUTH_API_KEY" ]; then
            echo "::warning::API 키 시크릿이 없어 검증 시드로 배포합니다."
          else
            node scraper/fetch_sources.mjs || echo "::warning::API 수집 실패 → 시드로 폴백"
          fi
          echo "---- data dir ----"; ls -la data/
      - name: 캐시 커밋(LLM 분류 + 게시판 후보)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youth-benefits-demo/data/llm_cache.json youth-benefits-demo/data/boards_cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: 분류·게시판 캐시 갱신 [skip ci]"
          git push || true
      - name: 배포 전 node_modules 제거(빌드 전용 — 사이트에 안 올림)
        run: rm -rf youth-benefits-demo/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: youth-benefits-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
