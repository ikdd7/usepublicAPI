# 푸시하면 GitHub Pages로 자동 배포됩니다 (정적 사이트, 빌드 없음).
# 활성화: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/niche-market-structure-cQHsO"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
